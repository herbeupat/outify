<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outify — Get Track</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  fieldset { margin-bottom: 1.5rem; min-width: 0; }
  label { display: block; margin-top: 0.75rem; font-weight: 600; }
  input[type=text], input[type=password], input[type=number], input[type=url] {
    width: 100%; padding: 0.5rem; box-sizing: border-box; margin-top: 0.2rem; font-size: 1rem;
  }
  .hint { font-weight: normal; font-size: 0.8rem; color: #666; }
  button {
    margin-top: 1.5rem; padding: 0.7rem 1.2rem; font-size: 1rem; cursor: pointer;
    width: 100%;
  }
  #new-track-btn { margin-top: 0.75rem; }
  .url-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.2rem; }
  .url-row input { margin-top: 0; flex: 1; min-width: 0; }
  #fetch-metadata-btn { margin-top: 0; width: auto; white-space: nowrap; flex-shrink: 0; }
  #fetch-metadata-btn:disabled { cursor: default; opacity: 0.7; }
  .spinner {
    display: inline-block; width: 1rem; height: 1rem;
    border: 2px solid rgba(0, 0, 0, 0.2); border-top-color: #333;
    border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #playlists { margin-top: 0.2rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  #playlists label { display: flex; align-items: center; gap: 0.4rem; font-weight: normal; margin-top: 0; padding: 0.2rem 0; }
  #playlists label input { width: auto; margin: 0; min-width: 1.1rem; min-height: 1.1rem; }
  #playlists .hint { display: block; margin: 0; }
  #result { white-space: pre-wrap; margin-top: 1rem; padding: 0.75rem; border-radius: 4px; word-break: break-word; }
  #result.success { background: #e6f7e6; border: 1px solid #4caf50; }
  #result.error { background: #fdecea; border: 1px solid #f44336; }

  @media (min-width: 480px) {
    button { width: auto; }
    #new-track-btn { margin-left: 0.75rem; }
  }

  @media (max-width: 400px) {
    body { margin: 1rem auto; padding: 0 0.75rem; }
    h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<h1>Outify — Get Track</h1>
<form id="track-form">
  <fieldset>
    <legend>API connection</legend>
    <label>Username
      <input type="text" id="username" required>
    </label>
    <label>Password
      <input type="password" id="password" required>
    </label>
  </fieldset>

  <fieldset>
    <legend>Track</legend>
    <label>URL *
      <div class="url-row">
        <input type="url" id="url" required>
        <button type="button" id="fetch-metadata-btn">Fetch metadata</button>
      </div>
    </label>
    <label>Artist *
      <input type="text" id="artist" required>
    </label>
    <label>Album *
      <input type="text" id="album" required>
    </label>
    <label>Title *
      <input type="text" id="title" required>
    </label>
    <label>Year
      <input type="text" id="year">
    </label>
    <label>Track number
      <input type="number" id="track" min="0">
    </label>
    <label>Cover URL
      <input type="url" id="cover">
    </label>
  </fieldset>

  <fieldset>
    <legend>Options</legend>
    <label>Add to playlist(s)</label>
    <div id="playlists"><span class="hint">Fill in username and password to load playlists.</span></div>
    <label>New playlist <span class="hint">(optional, created if it doesn't exist yet)</span>
      <input type="text" id="new_playlist" placeholder="my_new_playlist">
    </label>
    <label>Cookies from browser <span class="hint">(e.g. firefox, chrome)</span>
      <input type="text" id="cookies_from_browser">
    </label>
  </fieldset>

  <button type="submit">Download track</button>
  <button type="button" id="new-track-btn">New track</button>
</form>

<div id="result" style="display:none;"></div>

<script>
const apiBase = "{{API_BASE_URL}}";
const playlistsEl = document.getElementById('playlists');
let lastLoadedCredentials = null;
let lastAutoCheckedYear = null;

function authHeader(username, password) {
  return 'Basic ' + btoa(`${username}:${password}`);
}

function applyYearPlaylistSelection(newYear) {
  if (lastAutoCheckedYear && lastAutoCheckedYear !== newYear) {
    const previousCheckbox = document.querySelector(`.playlist-checkbox[value="${CSS.escape(lastAutoCheckedYear)}"]`);
    if (previousCheckbox) previousCheckbox.checked = false;
  }
  const newCheckbox = document.querySelector(`.playlist-checkbox[value="${CSS.escape(newYear)}"]`);
  if (newCheckbox) newCheckbox.checked = true;
  lastAutoCheckedYear = newYear;
}

async function refreshPlaylists() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  if (!username || !password) {
    lastLoadedCredentials = null;
    playlistsEl.innerHTML = '<span class="hint">Fill in username and password to load playlists.</span>';
    return;
  }

  const credentialsKey = `${username}:${password}`;
  if (credentialsKey === lastLoadedCredentials) return;
  lastLoadedCredentials = credentialsKey;

  playlistsEl.innerHTML = '<span class="hint">Loading playlists…</span>';

  try {
    const response = await fetch(`${apiBase}/playlists`, {
      headers: { 'Authorization': authHeader(username, password) },
    });
    if (!response.ok) {
      playlistsEl.innerHTML = '<span class="hint">Could not load playlists (check credentials).</span>';
      return;
    }
    const names = await response.json();
    if (names.length === 0) {
      playlistsEl.innerHTML = '<span class="hint">No playlists found.</span>';
      return;
    }
    playlistsEl.innerHTML = '';
    for (const name of names) {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'playlist-checkbox';
      checkbox.value = name;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(' ' + name));
      playlistsEl.appendChild(label);
    }
  } catch (err) {
    playlistsEl.innerHTML = '<span class="hint">Could not load playlists: ' + err.message + '</span>';
  }
}

document.getElementById('username').addEventListener('blur', refreshPlaylists);
document.getElementById('password').addEventListener('blur', refreshPlaylists);

document.getElementById('fetch-metadata-btn').addEventListener('click', async () => {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const url = document.getElementById('url').value;

  if (!username || !password) {
    alert('Please fill in username and password first.');
    return;
  }
  if (!url) {
    alert('Please fill in the URL first.');
    return;
  }

  const btn = document.getElementById('fetch-metadata-btn');
  const originalContent = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try {
    const response = await fetch(`${apiBase}/track/metadata?url=${encodeURIComponent(url)}`, {
      headers: { 'Authorization': authHeader(username, password) },
    });
    const data = await response.json();

    if (!response.ok) {
      alert('Could not fetch metadata: ' + (data.error || response.statusText));
      return;
    }

    if (data.title) document.getElementById('title').value = data.title;
    if (data.album && data.album.name) document.getElementById('album').value = data.album.name;
    if (Array.isArray(data.artists) && data.artists.length > 0) {
      document.getElementById('artist').value = data.artists.map(a => a.name).join(', ');
    }
    if (data.year) {
      document.getElementById('year').value = data.year;
      applyYearPlaylistSelection(data.year);
    }
    if (Array.isArray(data.thumbnail) && data.thumbnail.length > 0) {
      document.getElementById('cover').value = data.thumbnail[data.thumbnail.length - 1].url;
    }
  } catch (err) {
    alert('Could not fetch metadata: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalContent;
  }
});

document.getElementById('new-track-btn').addEventListener('click', () => {
  for (const id of ['artist', 'album', 'title', 'url', 'year', 'track', 'cover', 'new_playlist', 'cookies_from_browser']) {
    document.getElementById(id).value = '';
  }
  const resultEl = document.getElementById('result');
  resultEl.style.display = 'none';
  resultEl.textContent = '';
  resultEl.className = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('track-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;

  const payload = {
    artist: document.getElementById('artist').value,
    album: document.getElementById('album').value,
    title: document.getElementById('title').value,
    url: document.getElementById('url').value,
  };

  const year = document.getElementById('year').value;
  if (year) payload.year = year;

  const track = document.getElementById('track').value;
  if (track) payload.track = parseInt(track, 10);

  const cover = document.getElementById('cover').value;
  if (cover) payload.cover = cover;

  const selectedPlaylists = Array.from(document.querySelectorAll('.playlist-checkbox:checked')).map(cb => cb.value);
  const newPlaylist = document.getElementById('new_playlist').value.trim();
  if (newPlaylist) selectedPlaylists.push(newPlaylist);
  if (selectedPlaylists.length > 0) payload.add_to_playlist = selectedPlaylists;

  const cookiesFromBrowser = document.getElementById('cookies_from_browser').value;
  if (cookiesFromBrowser) payload.cookies_from_browser = cookiesFromBrowser;

  const resultEl = document.getElementById('result');
  resultEl.style.display = 'block';
  resultEl.className = '';
  resultEl.textContent = 'Downloading…';

  try {
    const response = await fetch(`${apiBase}/track`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': authHeader(username, password),
      },
      body: JSON.stringify(payload),
    });

    const data = await response.json();
    resultEl.className = response.ok ? 'success' : 'error';
    resultEl.textContent = JSON.stringify(data, null, 2);
    alert(response.ok ? 'Download complete: ' + data.file_path : 'Download failed: ' + data.error);
  } catch (err) {
    resultEl.className = 'error';
    resultEl.textContent = 'Request failed: ' + err.message;
    alert('Download failed: ' + err.message);
  }
});
</script>
</body>
</html>
